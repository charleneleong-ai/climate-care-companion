repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Must match the ruff in uv.lock. They were eight minor versions apart, and
    # the two disagree on formatting — so a file's style flipped depending on
    # whether `uv run ruff format` or `pre-commit` touched it last.
    rev: v0.16.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: merge-gates
        name: merge gates (worked example, no-cry-wolf, SC-1, voice utterances)
        entry: uv run pytest tests/verification -q
        language: system
        pass_filenames: false
        always_run: true
