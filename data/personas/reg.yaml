# The fluid tightrope. Fictional — SC-6.
# Enriched: respiratory added (COPD is present in ~30% of CKD patients, and the
# combination with heart failure — the "cardio-renal-pulmonary" triad — is one of
# the most dangerous presentations in heat). spironolactone added as a second
# diuretic (standard in heart failure management alongside furosemide, but it
# raises potassium, which is already stressed by the ACE inhibitor in heat).
# The fluid tightrope now has a potassium imbalance risk on top of volume.
# Score: age 75-84 (2) + lives alone (2) + cardiovascular (2) + renal (2)
#   + respiratory (1) + diuretic (2) + ace_arb (1) = 12
id: reg
name: Reg
age_band: b75_84
lives_alone: true
mobility_limited: false
conditions: [cardiovascular, renal, respiratory]
medications:
  - drug_name: furosemide
    drug_class: diuretic
  - drug_name: spironolactone
    drug_class: diuretic
  - drug_name: ramipril
    drug_class: ace_arb
