# The care-home resident. Fictional — SC-6.
# Enriched: sertraline added (prescribed in 40–60% of dementia patients in UK care
# homes for agitation/depression; it lowers sodium, which is already at risk from
# sweating in a hot building). cardiovascular added (atrial fibrillation is present
# in ~30% of care home residents with dementia at this age). amitriptyline added
# as a low-dose anticholinergic (widely prescribed for neuropathic pain in care
# homes, but it also suppresses sweating — amplifying the thermoregulation failure
# from quetiapine). Three drugs now impair heat response simultaneously.
# Score: age 85+ (3) + dementia (2) + cardiovascular (2) + mobility_limited (1)
#   + antipsychotic (2) + anticholinergic (2) + ssri (1) = 13
