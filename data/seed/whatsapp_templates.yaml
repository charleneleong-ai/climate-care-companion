# WhatsApp message templates.
#
# Meta must approve each of these in Business Manager before it can be sent. The
# wording is kept here so it is version-controlled, reviewable, and covered by the
# SC-1 gate — approval by Meta checks policy compliance, not clinical safety.
#
# The body must match the approved template exactly or the send is rejected.
# {{1}} etc are WhatsApp's positional variables.

checkin_opener:
  name: climatise_checkin_opener
  language: en_GB
  body: >
    Hello {{1}}. It is going to be hot where you are tonight. Can we ask you a few
    quick questions to check you are comfortable? Reply to this message to start.
  variables: [first_name]
  notes: >
    Business-initiated, so it must be a template. Deliberately asks permission
    rather than launching into questions — the 24-hour window opens on their reply,
    and consent to be asked is not the same as consent to be assessed.

checkin_opener_simple:
  name: climatise_checkin_opener_simple
  language: en_GB
  body: >
    Hello {{1}}. It will be hot tonight. Can we ask you a few questions? Reply to
    this message.
  variables: [first_name]
  notes: >
    Simplified register, selected when the assessment carries a dementia reason
    code. One clause per sentence.

caregiver_no_answer:
  name: climatise_caregiver_no_answer
  language: en_GB
  body: >
    We tried to check on {{1}} at {{2}} and did not get a reply. Conditions tonight
    are {{3}} risk for them. Please check on them if you can.
  variables: [cared_for_name, time, tier]
  notes: >
    Sent to the caregiver, not the cared-for person. A missed check-in during a
    risk window is the condition the system exists to catch, so it escalates
    rather than retrying silently.

heat_alert_caregiver:
  name: climatise_heat_alert_caregiver
  language: en_GB
  body: >
    {{1}}'s heat risk has risen to {{2}} for tonight. The most important thing to
    do: {{3}} Open Climatise for the rest of the plan.
  variables: [cared_for_name, tier, first_action]
  notes: >
    FR-21. Sent on an upward tier transition, not on a schedule. Carries one action
    rather than the whole plan — a message a caregiver reads at a bus stop can hold
    one instruction, and the app holds the rest. {{3}} is lifted verbatim from the
    prevention plan, so it has already been through the SC-1 gate.

heat_alert_person:
  name: climatise_heat_alert_person
  language: en_GB
  body: >
    Hello {{1}}. It is going to be hot tonight where you are. One thing that will
    help: {{2}} If you feel unwell, tell someone straight away.
  variables: [first_name, first_action]
  notes: >
    The same event, written for the person themselves. Shorter, second person, one
    clause per sentence, and no tier word — a label like "Severe" read alone on a
    phone frightens without telling anyone what to do. It closes by naming who to
    tell, because the failure mode for this group is not noticing and not saying.

heat_alert_invite:
  name: climatise_heat_alert_invite
  language: en_GB
  body: >
    Heat health warning for {{1}} from {{2}}. People over 65 and those with heart,
    lung or kidney conditions are most at risk. Find out what this means for you
    and get advice for your own situation: {{3}}
  variables: [area, start, link]
  notes: >
    The acquisition message, sent to residents in an alerted area who are not yet
    registered. Deliberately not personalised — nothing is known about the reader
    yet, and pretending otherwise would be the wrong first impression from a
    health service. It states the general risk, names who it applies to, and
    offers the personal version behind one tap.

    The link carries the warning that caused it, so the app can open by explaining
    why the message arrived rather than with a blank sign-up form.

escalation_visit:
  name: climatise_escalation_visit
  language: en_GB
  body: >
    {{1}} needs someone to check on them in person. {{2}} If you cannot go,
    please arrange for someone who can.
  variables: [cared_for_name, reason]
  notes: >
    Sent instead of the advice message, not alongside it. When the answer is
    "somebody has to attend", a list of things to do is the wrong shape: it
    invites the reader to do those things remotely and feel they have responded.
    {{2}} is the escalation's own sentence, already plain language.

escalation_emergency:
  name: climatise_escalation_emergency
  language: en_GB
  body: >
    Urgent: {{1}} has reported {{2}}. Call 999 now. Do not wait to check on them
    yourself first.
  variables: [cared_for_name, symptoms]
  notes: >
    SC-3 — only ever sent when an explicit red flag was reported, never inferred
    from a tier. The closing line exists because the instinct is to drive over
    and look, and for these symptoms that costs the time an ambulance needs.
