<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  body { margin: 0; }
  @keyframes av-blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(0.12); } }
</style>
</helmet>

<div style="width: {{ wrapperSize }}px; height: {{ wrapperSize }}px; position: relative;">
  <div style="width: 160px; height: 160px; transform: scale({{ scale }}); transform-origin: top left; position: absolute; left: 0; top: 0;">
    <div style="width: 160px; height: 160px; border-radius: 50%; background: linear-gradient(140deg, #F2A03F, #4E93BF); padding: 5px; box-sizing: border-box; box-shadow: 0 10px 24px rgba(0,0,0,0.16);">
      <div style="width: 100%; height: 100%; border-radius: 50%; background: #FFF3E4; position: relative; overflow: hidden;">

        <!-- EARTH -->
        <sc-if value="{{ isEarth }}" hint-placeholder-val="{{ false }}">
          <div style="position: absolute; inset: 0; border-radius: 50%; background: #4E93BF;"></div>
          <div style="position: absolute; left: 8px; top: 30px; width: 62px; height: 46px; border-radius: 46% 54% 60% 40% / 50% 40% 60% 50%; background: #6B8F5E;"></div>
          <div style="position: absolute; right: 4px; top: 70px; width: 58px; height: 52px; border-radius: 60% 40% 50% 50% / 40% 60% 40% 60%; background: #6B8F5E;"></div>
          <div style="position: absolute; left: 46px; top: 100px; width: 44px; height: 32px; border-radius: 50% 50% 40% 60% / 60% 40% 60% 40%; background: #C9A66B;"></div>
          <div style="position: absolute; left: 20px; top: 14px; width: 46px; height: 26px; border-radius: 50%; background: rgba(255,255,255,0.22);"></div>
        </sc-if>

        <!-- PERSON -->
        <sc-if value="{{ isPerson }}" hint-placeholder-val="{{ true }}">
          <div style="position: absolute; left: 60px; top: 92px; width: 30px; height: 40px; border-radius: 13px; background: #E3B084;"></div>
          <div style="position: absolute; left: 5px; top: 112px; width: 140px; height: 60px; border-radius: 70px 70px 0 0; background: #4E93BF;"></div>
          <div style="position: absolute; left: 12px; top: 56px; width: 16px; height: 22px; border-radius: 50%; background: #E3B084;"></div>
          <div style="position: absolute; right: 12px; top: 56px; width: 16px; height: 22px; border-radius: 50%; background: #E3B084;"></div>
          <div style="position: absolute; left: 25px; top: 16px; width: 100px; height: 108px; border-radius: 50px 50px 46px 46px / 58px 58px 54px 54px; background: #F3C89E;"></div>
          <div style="position: absolute; left: 21px; top: 10px; width: 108px; height: 48px; border-radius: 54px 54px 14px 14px; background: #8A6A4F;"></div>
          <div style="position: absolute; left: 30px; top: 84px; width: 20px; height: 11px; border-radius: 50%; background: rgba(226,116,92,0.32);"></div>
          <div style="position: absolute; left: 100px; top: 84px; width: 20px; height: 11px; border-radius: 50%; background: rgba(226,116,92,0.32);"></div>

          <sc-if value="{{ exprHappy }}" hint-placeholder-val="{{ true }}">
            <div style="position: absolute; left: 44px; top: 65px; width: 13px; height: 15px; border-radius: 50%; background: #3E2C20; animation: av-blink 6s ease-in-out infinite;"></div>
            <div style="position: absolute; left: 93px; top: 65px; width: 13px; height: 15px; border-radius: 50%; background: #3E2C20; animation: av-blink 6s ease-in-out infinite;"></div>
            <div style="position: absolute; left: 52px; top: 68px; width: 4px; height: 4px; border-radius: 50%; background: #FFFFFF;"></div>
            <div style="position: absolute; left: 101px; top: 68px; width: 4px; height: 4px; border-radius: 50%; background: #FFFFFF;"></div>
            <div style="position: absolute; left: 58px; top: 88px; width: 34px; height: 16px; border-bottom: 5px solid #6E4A34; border-radius: 0 0 40px 40px;"></div>
          </sc-if>
          <sc-if value="{{ exprHot }}" hint-placeholder-val="{{ false }}">
            <div style="position: absolute; left: 42px; top: 72px; width: 17px; height: 4px; border-radius: 2px; background: #3E2C20;"></div>
            <div style="position: absolute; left: 91px; top: 72px; width: 17px; height: 4px; border-radius: 2px; background: #3E2C20;"></div>
            <div style="position: absolute; left: 62px; top: 88px; width: 26px; height: 20px; border-radius: 0 0 24px 24px / 0 0 30px 30px; background: #6E4A34;"></div>
            <div style="position: absolute; top: 60px; right: 26px; width: 8px; height: 11px; border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%; background: #6FA8CC;"></div>
          </sc-if>
          <sc-if value="{{ exprCold }}" hint-placeholder-val="{{ false }}">
            <div style="position: absolute; left: 44px; top: 68px; width: 13px; height: 13px; border-radius: 50%; background: #3E2C20;"></div>
            <div style="position: absolute; left: 93px; top: 68px; width: 13px; height: 13px; border-radius: 50%; background: #3E2C20;"></div>
            <div style="position: absolute; left: 58px; top: 96px; width: 34px; height: 14px; border-top: 5px solid #6E4A34; border-radius: 40px 40px 0 0;"></div>
          </sc-if>
        </sc-if>

        <!-- GIRL -->
        <sc-if value="{{ isGirl }}" hint-placeholder-val="{{ false }}">
          <div style="position: absolute; left: 60px; top: 92px; width: 30px; height: 40px; border-radius: 13px; background: #E8B98F;"></div>
          <div style="position: absolute; left: 5px; top: 112px; width: 140px; height: 60px; border-radius: 70px 70px 0 0; background: #E0826A;"></div>
          <div style="position: absolute; left: 6px; top: 42px; width: 32px; height: 88px; border-radius: 20px 40px 40px 40px; background: #7A4426;"></div>
          <div style="position: absolute; right: 6px; top: 42px; width: 32px; height: 88px; border-radius: 40px 20px 40px 40px; background: #7A4426;"></div>
          <div style="position: absolute; left: 25px; top: 16px; width: 100px; height: 108px; border-radius: 50px 50px 46px 46px / 58px 58px 54px 54px; background: #F6D0AB;"></div>
          <div style="position: absolute; left: 18px; top: 6px; width: 114px; height: 54px; border-radius: 58px 58px 30px 30px; background: #7A4426;"></div>
          <div style="position: absolute; left: 30px; top: 84px; width: 20px; height: 11px; border-radius: 50%; background: rgba(226,116,92,0.34);"></div>
          <div style="position: absolute; left: 100px; top: 84px; width: 20px; height: 11px; border-radius: 50%; background: rgba(226,116,92,0.34);"></div>

          <sc-if value="{{ exprHappy }}" hint-placeholder-val="{{ true }}">
            <div style="position: absolute; left: 44px; top: 66px; width: 13px; height: 15px; border-radius: 50%; background: #3E2C20; animation: av-blink 6s ease-in-out infinite;"></div>
            <div style="position: absolute; left: 93px; top: 66px; width: 13px; height: 15px; border-radius: 50%; background: #3E2C20; animation: av-blink 6s ease-in-out infinite;"></div>
            <div style="position: absolute; left: 52px; top: 69px; width: 4px; height: 4px; border-radius: 50%; background: #FFFFFF;"></div>
            <div style="position: absolute; left: 101px; top: 69px; width: 4px; height: 4px; border-radius: 50%; background: #FFFFFF;"></div>
            <div style="position: absolute; left: 58px; top: 89px; width: 34px; height: 16px; border-bottom: 5px solid #B0553A; border-radius: 0 0 40px 40px;"></div>
          </sc-if>
          <sc-if value="{{ exprHot }}" hint-placeholder-val="{{ false }}">
            <div style="position: absolute; left: 42px; top: 73px; width: 17px; height: 4px; border-radius: 2px; background: #3E2C20;"></div>
            <div style="position: absolute; left: 91px; top: 73px; width: 17px; height: 4px; border-radius: 2px; background: #3E2C20;"></div>
            <div style="position: absolute; left: 62px; top: 89px; width: 26px; height: 20px; border-radius: 0 0 24px 24px / 0 0 30px 30px; background: #B0553A;"></div>
            <div style="position: absolute; top: 60px; right: 24px; width: 8px; height: 11px; border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%; background: #6FA8CC;"></div>
          </sc-if>
          <sc-if value="{{ exprCold }}" hint-placeholder-val="{{ false }}">
            <div style="position: absolute; left: 44px; top: 69px; width: 13px; height: 13px; border-radius: 50%; background: #3E2C20;"></div>
            <div style="position: absolute; left: 93px; top: 69px; width: 13px; height: 13px; border-radius: 50%; background: #3E2C20;"></div>
            <div style="position: absolute; left: 58px; top: 97px; width: 34px; height: 14px; border-top: 5px solid #B0553A; border-radius: 40px 40px 0 0;"></div>
          </sc-if>
        </sc-if>

      </div>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:160,&quot;height&quot;:160},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:140,&quot;tsType&quot;:&quot;number&quot;},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;person&quot;,&quot;girl&quot;,&quot;earth&quot;],&quot;default&quot;:&quot;person&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;expr&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;happy&quot;,&quot;hot&quot;,&quot;cold&quot;],&quot;default&quot;:&quot;happy&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const wrapperSize = this.props.size ?? 140;
    const variant = this.props.variant ?? 'person';
    const expr = this.props.expr ?? 'happy';
    return {
      wrapperSize, scale: wrapperSize / 160,
      isEarth: variant === 'earth', isPerson: variant === 'person', isGirl: variant === 'girl',
      exprHappy: expr === 'happy', exprHot: expr === 'hot', exprCold: expr === 'cold',
    };
  }
}

</script>
</body>
</html>
