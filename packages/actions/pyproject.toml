[project]
name = "climatise-actions"
version = "0.1.0"
description = "L4 checklist and notification policy."
requires-python = ">=3.13"
dependencies = ["climatise-contracts", "climatise-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/actions"]

[tool.uv.sources]
climatise-contracts = { workspace = true }
climatise-core = { workspace = true }
