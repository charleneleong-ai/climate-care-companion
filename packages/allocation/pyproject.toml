[project]
name = "climatise-allocation"
version = "0.1.0"
description = "Resource allocation: ranking, coverage, siting."
requires-python = ">=3.13"
dependencies = ["climatise-contracts", "climatise-geography"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/allocation"]

[tool.uv.sources]
climatise-contracts = { workspace = true }
climatise-geography = { workspace = true }
