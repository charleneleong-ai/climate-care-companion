[project]
name = "climatise-checkin"
version = "0.1.0"
description = "Voice check-in scripting over a closed utterance set."
requires-python = ">=3.13"
dependencies = ["climatise-contracts", "climatise-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/checkin"]

[tool.uv.sources]
climatise-contracts = { workspace = true }
climatise-core = { workspace = true }
