[project]
name = "climatise-core"
version = "0.1.0"
description = "L2 vulnerability and L3 risk fusion. Deterministic, no I/O."
requires-python = ">=3.13"
dependencies = ["climatise-contracts", "pyyaml>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core"]

[tool.uv.sources]
climatise-contracts = { workspace = true }
