[project]
name = "climatise-exposure"
version = "0.1.0"
description = "L1 indoor model and forecast normalisation."
requires-python = ">=3.13"
dependencies = ["climatise-contracts", "httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/exposure"]

[tool.uv.sources]
climatise-contracts = { workspace = true }
