[project]
name = "climatise-geography"
version = "0.1.0"
description = "Locality and resource discovery."
requires-python = ">=3.13"
dependencies = ["pydantic>=2.10", "pyyaml>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geography"]
