[project]
name = "climatise-org"
version = "0.1.0"
description = "L6 tenancy and stakeholder aggregations."
requires-python = ">=3.13"
dependencies = ["climatise-contracts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/org"]

[tool.uv.sources]
climatise-contracts = { workspace = true }
