[project]
name = "climatise-persons"
version = "0.1.0"
description = "L0 persona discovery and validation."
requires-python = ">=3.13"
dependencies = ["climatise-contracts", "pydantic>=2.10", "pyyaml>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/persons"]

[tool.uv.sources]
climatise-contracts = { workspace = true }
