[project]
name = "climatise-api"
version = "0.1.0"
description = "Read path."
requires-python = ">=3.13"
dependencies = ["climatise-contracts", "climatise-core", "climatise-persons", "climatise-actions", "climatise-exposure", "fastapi>=0.115"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]

[tool.uv.sources]
climatise-contracts = { workspace = true }
climatise-core = { workspace = true }
climatise-persons = { workspace = true }
climatise-actions = { workspace = true }
climatise-exposure = { workspace = true }
