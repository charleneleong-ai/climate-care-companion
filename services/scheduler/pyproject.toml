[project]
name = "climatise-scheduler"
version = "0.1.0"
description = "The 3-hourly sweep. Nothing else in the system initiates."
requires-python = ">=3.13"
dependencies = [
  "climatise-contracts",
  "climatise-core",
  "climatise-actions",
  "climatise-checkin",
  "climatise-exposure",
  "climatise-persons",
  "typer>=0.15",
  "rich>=13",
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scheduler"]

[tool.uv.sources]
climatise-actions = { workspace = true }
climatise-checkin = { workspace = true }
climatise-contracts = { workspace = true }
climatise-core = { workspace = true }
climatise-exposure = { workspace = true }
climatise-persons = { workspace = true }
