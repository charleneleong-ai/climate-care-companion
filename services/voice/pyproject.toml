[project]
name = "climatise-voice"
version = "0.1.0"
description = "Inbound webhook handler for check-in conversations."
requires-python = ">=3.13"
dependencies = ["climatise-contracts", "climatise-core", "climatise-checkin", "climatise-scheduler", "climatise-persons", "fastapi>=0.115", "python-multipart>=0.0.20"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice"]

[tool.uv.sources]
climatise-checkin = { workspace = true }
climatise-contracts = { workspace = true }
climatise-core = { workspace = true }
climatise-persons = { workspace = true }
climatise-scheduler = { workspace = true }
